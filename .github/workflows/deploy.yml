name: Deploy to shared hosting
# Run manually from the Actions tab (also works in the GitHub mobile app).
# Setup: php/docs/github-deploy.md
on:
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SSH_TARGET: ${{ vars.DEPLOY_SSH_TARGET }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
      DEPLOY_PUBLIC_DIR: ${{ vars.DEPLOY_PUBLIC_DIR }}
      DEPLOY_TOOLS_DIR: ${{ vars.DEPLOY_TOOLS_DIR }}
      DEPLOY_RELEASES_DIR: ${{ vars.DEPLOY_RELEASES_DIR }}
      DEPLOY_PHP: ${{ vars.DEPLOY_PHP || 'php' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required settings
        run: |
          for name in DEPLOY_SSH_TARGET DEPLOY_APP_DIR DEPLOY_PUBLIC_DIR DEPLOY_RELEASES_DIR; do
            [ -n "${!name}" ] || { echo "Set the $name variable on the production environment."; exit 1; }
          done
      - name: Check PHP syntax and backend tests
        working-directory: php
        run: |
          find src templates public scripts -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php tests/backups.php
          php tests/sessions.php
          python3 tests/deploy-release.py
      - name: Build release
        id: build
        working-directory: php
        run: |
          name="github-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::12}"
          php scripts/build-release.php "$RUNNER_TEMP/$name" "$GITHUB_SHA"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo 'Set the DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS secrets.'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Upload and install release
        env:
          RELEASE: ${{ steps.build.outputs.name }}
        run: |
          ssh_cmd=(ssh -p "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          remote="$DEPLOY_RELEASES_DIR/$RELEASE"
          # tar over SSH: shared hosts do not always provide rsync.
          tar -C "$RUNNER_TEMP/$RELEASE" -czf - . | "${ssh_cmd[@]}" "$DEPLOY_SSH_TARGET" "umask 077 && mkdir -- $(printf '%q' "$remote") && tar -xzf - -C $(printf '%q' "$remote")"
          args=("$DEPLOY_PHP" "$remote/deploy-shared-host.php" "$remote" "$DEPLOY_APP_DIR" "$DEPLOY_PUBLIC_DIR")
          [ -n "$DEPLOY_TOOLS_DIR" ] && args+=("$DEPLOY_TOOLS_DIR")
          "${ssh_cmd[@]}" "$DEPLOY_SSH_TARGET" "$(printf '%q ' "${args[@]}")"
      - name: Keep the five newest GitHub releases on the server
        run: |
          ssh_cmd=(ssh -p "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          releases=$(printf '%q' "$DEPLOY_RELEASES_DIR")
          "${ssh_cmd[@]}" "$DEPLOY_SSH_TARGET" "cd $releases && ls -1d github-[0-9]*T[0-9]*Z-[0-9a-f]* 2>/dev/null | sort | head -n -5 | while read -r old; do rm -rf -- \"\$old\"; done"
      - if: always()
        run: rm -f ~/.ssh/deploy_key
