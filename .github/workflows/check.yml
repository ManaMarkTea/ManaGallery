name: Gallery checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check-source.py
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: php/package-lock.json
      - run: python3 scripts/check-source.py
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-mbstring php-sqlite3 php-gd composer
      - run: composer install --no-dev --no-interaction --no-plugins --no-scripts
      - run: find src templates public tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/gallery.php
      - run: php --ri sodium
      - run: php tests/accounts.php
      - run: php tests/backups.php
      - run: php tests/notifications.php
      - run: php -d disable_functions=mail tests/mail-sender.php
      - run: php tests/smtp.php
      - run: python3 tests/backup-verification.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
