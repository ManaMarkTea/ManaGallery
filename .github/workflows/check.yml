name: Gallery checks
on:
  push:
  pull_request:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
jobs:
  docker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: managallery-ci
      MANAGALLERY_PORT: 18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: python3 scripts/test-docker.py
      - run: npx --yes @devcontainers/cli up --workspace-folder .
      - run: |
          npx --yes @devcontainers/cli exec --workspace-folder . php -r 'exit(extension_loaded("gd") && extension_loaded("pdo_sqlite") && is_file(getenv("RENDERGALLERY_PHP_CATALOGUE")) ? 0 : 1);'
      - if: always()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down --volumes
  source:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check-source.py
  php:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: php/package-lock.json
      - run: python3 scripts/check-source.py
      - run: sudo apt-get update && sudo apt-get install -y php-cli php-mbstring php-sqlite3 php-gd php-zip php-curl composer
      - run: composer install --no-interaction --no-plugins --no-scripts
      - run: composer format:check
      - run: find src templates public tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/gallery.php
      - run: php tests/glb.php
      - run: php --ri sodium
      - run: php tests/accounts.php
      - run: php tests/comments.php
      - run: php tests/public-previews.php
      - run: php tests/backups.php
      - run: php tests/drive-backup.php
      - run: php tests/notifications.php
      - run: php tests/discord-images.php
      - run: php tests/security.php
      - run: php -d disable_functions=mail tests/mail-sender.php
      - run: php tests/smtp.php
      - run: python3 tests/backup-verification.py
      - run: python3 tests/incremental-backup.py
      - run: python3 tests/drive-connection.py
      - run: npm ci
      - run: npm run check:viewer
      - run: npm run test:tools
      - run: npx playwright install --with-deps chromium
      - run: npm test
