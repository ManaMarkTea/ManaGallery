name: managallery
services:
  web:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${MANAGALLERY_PORT:-8080}:80"
    volumes:
      - gallery-data:/var/lib/managallery
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
volumes:
  gallery-data:
